<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Glowing Top Light -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Line Gradient -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Rounded App Icon Frame -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Top Right Light Burst (Enlightening the Future) -->
  <g transform="translate(400, 90)">
    <circle cx="0" cy="0" r="45" fill="url(#sunGlow)" />
    <!-- Rays -->
    <path d="M0,-35 L0,35 M-35,0 L35,0 M-25,-25 L25,25 M-25,25 L25,-25 M0,-25 L0,25 M-18,-18 L18,18" stroke="#38bdf8" stroke-width="1.8" opacity="0.75" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6.5" fill="#f8fafc" />
    <!-- Slogan Text -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">enlightening</text>
    <text x="0" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">the future</text>
  </g>

  <!-- TR Double-Line Monogram -->
  <g transform="translate(10, 30)" filter="url(#glowEffect)">
    <!-- Cyan Path (Outer/Top) -->
    <!-- T top bar & Stem + R loop & leg -->
    <path 
      d="M 115 155 L 340 155 
         M 115 175 L 330 175 C 395 175, 435 210, 435 260 C 435 305, 395 340, 335 340 L 255 340
         M 205 175 L 105 385
         M 255 175 L 195 305 L 155 385
         M 265 340 L 355 465
         M 315 340 L 405 465" 
      fill="none" 
      stroke="#00d2ff" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- White Inner Precision Lines -->
    <path 
      d="M 155 195 L 310 195 C 360 195, 395 220, 395 260 C 395 295, 360 320, 315 320 L 260 320
         M 230 195 L 135 385
         M 285 320 L 375 465" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>
</svg>
